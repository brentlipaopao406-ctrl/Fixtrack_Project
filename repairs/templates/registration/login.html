{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | FixTrack</title>

    <link rel="stylesheet" href="{% static 'repairs/css/app.css' %}">
    <link rel="icon" type="image/png" href="{% static 'repairs/img/fixtrack-logo.png' %}">

    <style>
        /* PASSWORD FIELD */
        .password-wrapper {
            position: relative !important;
            width: 100% !important;
            display: block !important;
        }

        .password-wrapper input {
            width: 100% !important;
            padding-right: 55px !important;
            box-sizing: border-box !important;
        }

        /* EYE BUTTON */
        .password-wrapper .password-toggle {
            position: absolute !important;
            top: 50% !important;
            right: 10px !important;
            transform: translateY(-50%) !important;

            width: 38px !important;
            height: 38px !important;
            min-width: 38px !important;
            min-height: 38px !important;

            margin: 0 !important;
            padding: 0 !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            background: transparent !important;
            border: none !important;
            border-radius: 8px !important;

            color: #64748b !important;
            box-shadow: none !important;

            cursor: pointer !important;
            z-index: 10 !important;
        }

        .password-wrapper .password-toggle:hover {
            background: #f1f5f9 !important;
            color: #2563eb !important;
            transform: translateY(-50%) !important;
            box-shadow: none !important;
        }

        .password-toggle svg {
            width: 20px !important;
            height: 20px !important;
            display: block !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body class="auth-page">

<div class="auth-card">

    <div class="auth-mark">
        <img
            class="login-logo"
            src="{% static 'repairs/img/fixtrack-logo.png' %}"
            alt="FixTrack"
        >
    </div>

    <h1>Welcome to FixTrack</h1>

    <p>Sign in to manage repair requests and maintenance tasks.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <label>Username</label>
        {{ form.username }}
        {{ form.username.errors }}

        <label>Password</label>

        <div class="password-wrapper">

            {{ form.password }}

            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                aria-label="Show password"
            >

              <svg
    id="eye-icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
>
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
    <circle cx="12" cy="12" r="3"/>
</svg>
            </button>
        </div>

        {{ form.password.errors }}

        <button class="primary full" type="submit">
            Sign In
        </button>

    </form>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("id_password");
    const eyeOpen = document.getElementById("eye-open");
    const eyeClosed = document.getElementById("eye-closed");
    const button = document.querySelector(".password-toggle");

    if (password.type === "password") {
        password.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
        button.setAttribute("aria-label", "Hide password");
    } else {
        password.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
        button.setAttribute("aria-label", "Show password");
    }
}
</script>

</body>
</html>
